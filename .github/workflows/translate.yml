name: 🇻🇳 Dịch EPUB Tiếng Việt

on:
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: |
            cache.json
            state.json
          key: epub-cache-${{ github.run_id }}
          restore-keys: epub-cache-

      - name: Run translate
        run: |
          FILES=$(find . -name "*.epub" ! -name "*TiengViet*")

          for EPUB in $FILES; do
            echo "📖 $EPUB"
            python translate.py "$EPUB" || echo "⚠️ skip $EPUB"
            sleep $((RANDOM % 30 + 20))
          done

      - uses: actions/upload-artifact@v4
        with:
          name: result
          path: "*_TiengViet.epub"
