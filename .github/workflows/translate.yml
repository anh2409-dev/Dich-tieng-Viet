name: 📚 EPUB Translate (iPhone Friendly)

on:
  workflow_dispatch:
    inputs:
      filename:
        description: "Tên file EPUB"
        required: true

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install ebooklib beautifulsoup4 lxml requests tqdm

      - name: Run translate
        run: |
          python translate.py "${{ github.event.inputs.filename }}"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: "*_Translated.epub"
